<h2>{{ question().text }}</h2>

<form class="quiz-form">
  @for (option of question().options; track option.text) {
  <div class="option-container">
    <input
      type="radio"
      [id]="'option-' + $index"
      name="options"
      (change)="selectOption(option.isCorrect)"
      class="option-input"
    />
    <label [for]="'option-' + $index" class="option-label">{{ option.text }}</label>
  </div>
  }
</form>
